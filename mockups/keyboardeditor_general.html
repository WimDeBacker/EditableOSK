<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard Editor mock-up - General</title>
<style>
/* Colours are the tokens of FluentTheme.cs (light and dialog-dark); sizes are design pixels at 100 %.
   The whole dialog interior is the card colour, because FluentPainter.ApplyDialogTheme paints every panel with it. */
:root{
  --page:#F3F3F3; --card:#FFFFFF; --input:#FFFFFF;
  --text:#1C1C1C;          /* TextPrimary / DialogDarkText */
  --accent:#005496; --success:#0A640A; --danger:#961E14;
  --neutral:#F2F2F2; --neutral-hover:#E1E1E1;   /* Neutral, hover = 7 % darker */
  --ctl:#767676; --ctl-h:#505050;               /* ControlBorder, ControlBorderHover */
  --tb:#767676;                                 /* text box / chip / list frame border */
  --btn-text:#1C1C1C;                           /* neutral buttons keep dark text on both themes */
  --colored-outline:transparent;                /* dark theme: coloured buttons get a light outline */
  --dis-fill:#E8E8E8; --dis-border:#C8C8C8; --dis-text:#7D7D7D;
  --row-line:#E5E5E5; --focus:#005496;
  --desk:#C9CED6; --titlebar:#FFFFFF; --titletext:#000000; --frame:#9A9A9A;
  --hint:var(--text);                           /* ApplyTheme recolours every Label to the plain text colour (spec D22) */
}
:root[data-theme=dark]{
  --page:#202020; --card:#303030; --input:#3A3A3A; --text:#E6E6E6;
  --tb:#969696; --colored-outline:#969696; --dis-fill:#282828; --dis-border:#555555; --dis-text:#7D7D7D;
  --row-line:#969696; --focus:#E6E6E6;
  --desk:#101114; --titlebar:#202020; --titletext:#FFFFFF; --frame:#555555;
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--text);font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;font-size:16.67px;line-height:1.25}
.tools{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:10px 16px;background:#1f2430;color:#fff;font-size:14px;font-family:system-ui,sans-serif}
.tools .grp{display:inline-flex;gap:0}
.tools button{font:inherit;color:#fff;background:#39425a;border:1px solid #6b7595;padding:6px 14px;cursor:pointer}
.tools button:first-child{border-radius:4px 0 0 4px}.tools button:last-child{border-radius:0 4px 4px 0}
.tools button[aria-pressed=true]{background:#0a66c2;border-color:#8fb8e8}
.tools .note{opacity:.8}
.tools a{color:#cfe3ff}
.stage{padding:24px 16px;overflow-x:auto}
.win{width:922px;margin:0 auto;border:1px solid var(--frame);background:var(--card);box-shadow:0 8px 28px rgba(0,0,0,.35)}
.title{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--titlebar);color:var(--titletext);font-size:13px}
.client{width:920px;padding:16px;background:var(--card)}
/* section bar */
.tabs{display:flex;flex-wrap:wrap;margin-bottom:8px}
.tab{display:inline-flex;align-items:center;height:44px;min-width:96px;padding:0 14px;margin:0 6px 6px 0;border:1px solid var(--ctl);border-radius:5px;background:var(--neutral);color:var(--btn-text);text-decoration:none;cursor:pointer}
.tab.sel{background:var(--accent);color:#fff;border-color:var(--colored-outline,var(--accent))}
:root:not([data-theme=dark]) .tab.sel{border-color:var(--accent)}
.body{padding:16px}
/* label | input table (NewTable: auto label column, filling input column) */
.rows{display:grid;grid-template-columns:max-content 1fr;column-gap:16px;align-items:center}
.lbl{display:flex;align-items:center;min-height:44px;margin:4px 0;max-width:260px}
.cell{margin:4px 0;display:flex;align-items:center;gap:8px;min-width:0}
.wide{grid-column:1 / span 2;margin:4px 0;display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.heading{grid-column:1 / span 2;font-weight:700;margin:8px 0 8px}
.hint{font-size:14.67px;color:var(--hint)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;min-width:120px;padding:0 16px;border:1px solid var(--ctl);border-radius:5px;background:var(--neutral);color:var(--btn-text);font:inherit;cursor:pointer}
.btn:hover{background:var(--neutral-hover);border-color:var(--ctl-h)}
.btn.success{background:var(--success);color:#fff;border-color:var(--colored-outline,var(--success))}
:root:not([data-theme=dark]) .btn.success{border-color:var(--success)}
.btn.success:hover{background:#08500A}
.btn[disabled]{background:var(--dis-fill);border-color:var(--dis-border);color:var(--dis-text);cursor:default}
.choice{justify-content:space-between;min-width:240px;padding:0 14px;gap:14px}
.choice .arr{width:26px;text-align:center}
.stepper{display:inline-flex;width:176px;height:44px;gap:4px}
.stepper .sb{width:44px;min-width:44px;padding:0;font-size:21px;font-weight:700}
.stepper .sv{flex:1;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--tb);background:var(--input);color:var(--text)}
.stepper.off .sv{background:var(--dis-fill);border-color:var(--dis-border);color:var(--dis-text)}
.chip{display:inline-flex;align-items:center;justify-content:center;height:44px;min-width:104px;padding:0 14px;border:1px solid var(--tb);border-radius:5px;color:#fff;cursor:pointer;font:inherit}
.check{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 16px 0 14px;border:1px solid var(--ctl);border-radius:5px;background:var(--neutral);color:var(--btn-text);cursor:pointer;user-select:none;white-space:nowrap}
.check:hover{background:var(--neutral-hover);border-color:var(--ctl-h)}
.check .box{position:relative;width:24px;height:24px;border:2px solid var(--ctl-h);border-radius:4px;background:#fff;flex:none}
.check.on .box{background:var(--accent)}
.check.on .box::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.check.dis{background:var(--dis-fill);border-color:var(--dis-border);color:var(--dis-text);cursor:default}
.check.dis .box{background:var(--dis-fill);border-color:var(--dis-border)}
.check.dis.on .box{background:var(--dis-text)}
.unit{color:var(--text)}
.footer{display:flex;justify-content:flex-end;gap:8px;padding:8px 16px 0}
u{text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
</style>
</head>
<body>
<div class="tools">
  <strong>Mock-up (static picture, not the program): Keyboard Editor, General</strong>
  <span class="grp" role="group" aria-label="Theme"><button id="b-light" aria-pressed="true">Light</button><button id="b-dark" aria-pressed="false">Dark</button></span>
  <span class="grp" role="group" aria-label="Language"><button id="b-en" aria-pressed="true">English</button><button id="b-nl" aria-pressed="false">Nederlands</button></span>
  <span class="note">Click a drop-down to cycle its choices (the language drop-down also switches this picture, as the real one does).
  Other sections: <a href="keyboardeditor_accessibility.html">Accessibility</a>, <a href="keyboardeditor_wordprediction.html">Word prediction</a>. Spec: keyboardeditor_spec.md</span>
</div>
<div class="stage">
<div class="win" role="dialog" aria-labelledby="ttl">
  <div class="title"><span id="ttl" data-i="Edit Keyboard"></span><span aria-hidden="true">&#10005;</span></div>
  <div class="client">
    <div class="tabs" role="tablist">
      <a class="tab sel" role="tab" aria-selected="true" href="keyboardeditor_general.html" data-i="General"></a>
      <a class="tab" role="tab" aria-selected="false" href="keyboardeditor_accessibility.html" data-i="Accessibility"></a>
      <a class="tab" role="tab" aria-selected="false" href="keyboardeditor_wordprediction.html" data-i="wp: Word prediction"></a>
    </div>
    <div class="body">
      <div class="rows">
        <!-- G1 Language -->
        <div class="lbl" data-i="Language"></div>
        <div class="cell"><button class="btn choice" id="c-lang" data-tip="tip: Language" data-aria="Language"><span class="txt"></span><span class="arr">&#9662;</span></button></div>

        <!-- G2 heading -->
        <div class="heading" data-i="Window"></div>

        <!-- G3 Toolbar theme -->
        <div class="lbl" data-i="Toolbar theme"></div>
        <div class="cell"><button class="btn choice" id="c-theme" data-tip="tip: Toolbar theme" data-aria="Toolbar theme"><span class="txt"></span><span class="arr">&#9662;</span></button></div>

        <!-- G4 Transparency -->
        <div class="lbl" data-i="Opacity"></div>
        <div class="cell"><span class="stepper" id="s-op" data-tip="tip: Opacity"><button class="btn sb" aria-label="Decrease">&#8722;</button><span class="sv" role="spinbutton" aria-valuemin="0" aria-valuemax="80"></span><button class="btn sb" aria-label="Increase">+</button></span><span class="unit">%</span></div>

        <!-- G5 Background chip -->
        <div class="wide"><button class="chip" id="chip-bg" style="background:#1A1A2E" data-tip="tip: Background" data-i="Background"></button></div>

        <!-- G6, G7 -->
        <div class="wide"><span class="check" role="checkbox" tabindex="0" id="k-top" data-tip="tip: Always on top"><span class="box"></span><span data-i="Always on top"></span></span></div>
        <div class="wide"><span class="check" role="checkbox" tabindex="0" id="k-hide" data-tip="tip: Hide title bar"><span class="box"></span><span data-i="Hide title bar"></span></span></div>

        <!-- G8 heading -->
        <div class="heading" data-i="Layout file"></div>

        <!-- G9 Save, Save As, Load -->
        <div class="wide">
          <button class="btn" data-i="Save" data-tip="tip: Save settings"></button>
          <button class="btn" data-i="Save As…" data-tip="tip: Save settings as"></button>
          <button class="btn" data-i="Load…" data-tip="tip: Load"></button>
        </div>
      </div>
    </div>
    <div class="footer">
      <button class="btn" data-i="Cancel"></button>
      <button class="btn success" data-i="Apply"></button>
    </div>
  </div>
</div>
</div>

<script>
/* Strings: the keys and texts of keyboardeditor_spec.md section 3 (English from LanguageManager.cs, Dutch from lang_nl.xml). */
var S={
en:{"Edit Keyboard":"Edit Keyboard","General":"General","Accessibility":"Accessibility","wp: Word prediction":"Word prediction",
"Apply":"A&pply","Cancel":"&Cancel","Language":"Language","Toolbar theme":"T&oolbar theme","Dark":"Dark","Light":"Light","System default":"System default",
"Window":"Window","Opacity":"&Transparency","Background":"Background","Always on top":"&Always on top","Hide title bar":"H&ide title bar",
"Layout file":"Layout file","Save":"&Save","Save As…":"Sa&ve As…","Load…":"&Load…",
"tip: Language":"Select the interface language",
"tip: Toolbar theme":"Colours of the toolbar above the keyboard: dark, light, or the same as Windows.",
"tip: Opacity":"Keyboard window transparency  (0 = fully opaque,  80 = nearly transparent)",
"tip: Background":"Colour of the keyboard window behind the keys. Click to choose.",
"tip: Always on top":"Keep the keyboard floating above all other windows.",
"tip: Hide title bar":"Hide the Windows title bar for a cleaner floating keyboard look.",
"tip: Save settings":"Apply the changes and save the layout file.",
"tip: Save settings as":"Apply the changes and save the layout file under a new name.",
"tip: Load":"Load layout file"},
nl:{"Edit Keyboard":"Toetsenbord bewerken","General":"Algemeen","Accessibility":"Toegankelijkheid","wp: Word prediction":"Woordvoorspelling",
"Apply":"Toe&passen","Cancel":"Ann&uleren","Language":"Taal","Toolbar theme":"&Werkbalkthema","Dark":"Donker","Light":"Licht","System default":"Systeemstandaard",
"Window":"Venster","Opacity":"&Transparantie","Background":"Achtergrond","Always on top":"Altijd &bovenaan","Hide title bar":"Titelbalk &verbergen",
"Layout file":"Lay-outbestand","Save":"&Opslaan","Save As…":"Op&slaan als…","Load…":"&Laden…",
"tip: Language":"De interfacetaal selecteren",
"tip: Toolbar theme":"Kleuren van de werkbalk boven het toetsenbord: donker, licht of gelijk aan Windows.",
"tip: Opacity":"Transparantie van het venster  (0 = volledig zichtbaar,  80 = bijna onzichtbaar)",
"tip: Background":"Kleur van het toetsenbordvenster achter de toetsen. Klik om te kiezen.",
"tip: Always on top":"Het toetsenbord boven alle andere vensters houden.",
"tip: Hide title bar":"De Windows-titelbalk verbergen voor een strakker zwevend toetsenbord.",
"tip: Save settings":"De wijzigingen toepassen en het lay-outbestand opslaan.",
"tip: Save settings as":"De wijzigingen toepassen en het lay-outbestand onder een nieuwe naam opslaan.",
"tip: Load":"Lay-outbestand laden"}
};
var lang="en", langNames=["English","Nederlands"], langCodes=["en","nl"];
function t(k){return (S[lang][k]!==undefined?S[lang][k]:S.en[k])}
function vis(s){return s.replace(/&(.)/,"<u>$1</u>")}
function plain(s){return s.replace("&","")}
var themeIdx=0, themeKeys=["Dark","Light","System default"];
var opacity=0;
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(function(e){e.innerHTML=vis(t(e.dataset.i))});
  document.querySelectorAll("[data-tip]").forEach(function(e){e.title=plain(t(e.dataset.tip))});
  document.querySelectorAll("[data-aria]").forEach(function(e){e.setAttribute("aria-label",plain(t(e.dataset.aria)))});
  document.querySelector("#c-lang .txt").textContent=langNames[langCodes.indexOf(lang)];
  document.querySelector("#c-theme .txt").textContent=t(themeKeys[themeIdx]);
  document.querySelector("#s-op .sv").textContent=opacity;
  document.getElementById("chip-bg").setAttribute("aria-label",plain(t("Background"))+" color #1A1A2E");
  document.getElementById("b-en").setAttribute("aria-pressed",lang==="en");
  document.getElementById("b-nl").setAttribute("aria-pressed",lang==="nl");
}
function setTheme(d){document.documentElement.dataset.theme=d?"dark":"light";
  document.getElementById("b-dark").setAttribute("aria-pressed",d);document.getElementById("b-light").setAttribute("aria-pressed",!d)}
document.getElementById("b-light").onclick=function(){setTheme(false)};
document.getElementById("b-dark").onclick=function(){setTheme(true)};
document.getElementById("b-en").onclick=function(){lang="en";render()};
document.getElementById("b-nl").onclick=function(){lang="nl";render()};
document.getElementById("c-lang").onclick=function(){lang=langCodes[(langCodes.indexOf(lang)+1)%langCodes.length];render()};
document.getElementById("c-theme").onclick=function(){themeIdx=(themeIdx+1)%3;render()};
var sb=document.querySelectorAll("#s-op .sb");
sb[0].onclick=function(){opacity=Math.max(0,opacity-5);render()};
sb[1].onclick=function(){opacity=Math.min(80,opacity+5);render()};
document.querySelectorAll(".check").forEach(function(c){
  function flip(){if(c.classList.contains("dis"))return;c.classList.toggle("on");c.setAttribute("aria-checked",c.classList.contains("on"))}
  c.setAttribute("aria-checked","false");
  c.onclick=flip;c.onkeydown=function(e){if(e.key===" "){e.preventDefault();flip()}};
});
document.getElementById("k-top").classList.add("on");document.getElementById("k-top").setAttribute("aria-checked","true");
render();
</script>
</body>
</html>
